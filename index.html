<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>XSS Scanner · Security Assessment</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0f1a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #e6edf3;
        }

        .app-container {
            max-width: 560px;
            width: 100%;
            background: #161b26;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #2d3748;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .app-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-header .badge {
            background: #1f2937;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #8b9bb5;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .subhead {
            color: #8b9bb5;
            font-size: 0.95rem;
            margin-bottom: 24px;
            border-left: 3px solid #2f8cf0;
            padding-left: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-row label {
            font-weight: 500;
            color: #b9c8e0;
            font-size: 0.95rem;
            min-width: 60px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 16px;
            background: #0f141f;
            border: 1px solid #2d3748;
            border-radius: 60px;
            color: #f0f6fc;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            min-width: 180px;
        }

        .input-row input:focus {
            border-color: #2f8cf0;
            box-shadow: 0 0 0 3px rgba(47, 140, 240, 0.2);
        }

        .input-row input::placeholder {
            color: #4a5a72;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            margin: 8px 0 16px;
            flex-wrap: wrap;
        }

        .btn {
            background: #1f2937;
            border: none;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #e6edf3;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            min-width: 120px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #2d3748;
        }

        .btn-primary {
            background: #2f8cf0;
            border-color: #2f8cf0;
            color: white;
            box-shadow: 0 4px 12px rgba(47, 140, 240, 0.2);
        }

        .btn-primary:active { transform: scale(0.96); background: #1f7ad8; }
        .btn-secondary:active { background: #2d3b4f; }
        .btn:disabled { opacity: 0.5; pointer-events: none; filter: grayscale(0.6); }

        .status-panel {
            background: #0f141f;
            border-radius: 20px;
            padding: 16px 18px;
            margin: 20px 0 12px;
            border-left: 4px solid #2f8cf0;
            font-size: 0.95rem;
            min-height: 68px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            word-break: break-word;
        }

        .status-panel .label {
            background: #1f2937;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #b9c8e0;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .progress-container {
            margin: 16px 0 12px;
        }

        .progress-bar {
            height: 6px;
            background: #1f2937;
            border-radius: 12px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #2f8cf0;
            border-radius: 12px;
            transition: width 0.3s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px 0 16px;
        }

        .stat-item {
            background: #0f141f;
            border-radius: 16px;
            padding: 10px 6px;
            text-align: center;
            border: 1px solid #1f2937;
        }

        .stat-item .number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f0f6fc;
            display: block;
        }

        .stat-item .desc {
            font-size: 0.6rem;
            color: #8b9bb5;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .result-area {
            margin-top: 16px;
        }

        .result-card {
            background: #0f141f;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #2d3748;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-header span {
            font-weight: 500;
            color: #8b9bb5;
            font-size: 0.9rem;
        }

        .vuln-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 260px;
            overflow-y: auto;
        }

        .vuln-list li {
            background: #161b26;
            padding: 12px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            border-left: 4px solid #f28b82;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .vuln-list .empty {
            color: #4a5a72;
            text-align: center;
            padding: 20px 0 10px;
            font-size: 0.95rem;
            border-left: none;
            background: transparent;
        }

        .vuln-item .title {
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .vuln-item .meta {
            font-size: 0.75rem;
            color: #8b9bb5;
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .vuln-item .evidence {
            background: #0f141f;
            padding: 6px 10px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.7rem;
            color: #b9c8e0;
            margin-top: 6px;
            word-break: break-all;
            border: 1px solid #1f2937;
        }

        .export-btn {
            background: transparent;
            border: 1px solid #2d3748;
            padding: 8px 16px;
            border-radius: 40px;
            color: #b9c8e0;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .export-btn:hover {
            background: #1f2937;
        }

        .footnote {
            margin-top: 24px;
            font-size: 0.7rem;
            color: #4a5a72;
            text-align: center;
            border-top: 1px solid #1f2937;
            padding-top: 18px;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #2d3748;
            border-top-color: #2f8cf0;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .app-container { padding: 18px 14px; }
            .input-row { flex-direction: column; align-items: stretch; }
            .input-row label { min-width: auto; }
            .action-bar .btn { flex: 1 1 100%; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .vuln-list li { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <div class="app-header">
            <h1>🛡️ XSS•scan</h1>
            <span class="badge">v2 · backend</span>
        </div>
        <div class="subhead">⚡ evidence-based reflected XSS · low false positives</div>

        <div class="input-group">
            <div class="input-row">
                <label for="targetInput">🔗 Target</label>
                <input type="text" id="targetInput" placeholder="https://example.com/page" value="https://testphp.vulnweb.com">
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-primary" id="scanBtn">▶ Scan</button>
            <button class="btn btn-secondary" id="stopBtn" disabled>⏹ Stop</button>
            <button class="btn btn-secondary" id="clearBtn">✕ Clear</button>
        </div>

        <div class="status-panel" id="statusPanel">
            <span class="label" id="statusLabel">⏳ ready</span>
            <span id="statusText">enter a URL to start</span>
        </div>

        <div class="progress-container">
            <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
        </div>

        <div class="stats-grid">
            <div class="stat-item"><span class="number" id="statUrls">0</span><span class="desc">URLs</span></div>
            <div class="stat-item"><span class="number" id="statParams">0</span><span class="desc">Params</span></div>
            <div class="stat-item"><span class="number" id="statFindings">0</span><span class="desc">Findings</span></div>
            <div class="stat-item"><span class="number" id="statQueue">0</span><span class="desc">Queue</span></div>
        </div>

        <div class="result-area">
            <div class="result-card">
                <div class="result-header">
                    <span>📋 Findings</span>
                    <div>
                        <button class="export-btn" id="exportBtn">⬇ Export JSON</button>
                    </div>
                </div>
                <ul class="vuln-list" id="vulnList">
                    <li class="empty">no findings yet</li>
                </ul>
            </div>
        </div>

        <div class="footnote">
            <span>🔒 backend scans · respects robots · evidence-based · authorized use only</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ----- DOM refs -----
            const targetInput = document.getElementById('targetInput');
            const scanBtn = document.getElementById('scanBtn');
            const stopBtn = document.getElementById('stopBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusLabel = document.getElementById('statusLabel');
            const statusText = document.getElementById('statusText');
            const progressFill = document.getElementById('progressFill');
            const statUrls = document.getElementById('statUrls');
            const statParams = document.getElementById('statParams');
            const statFindings = document.getElementById('statFindings');
            const statQueue = document.getElementById('statQueue');
            const vulnList = document.getElementById('vulnList');
            const exportBtn = document.getElementById('exportBtn');

            // ----- state -----
            let scanActive = false;
            let findings = [];
            let scanId = null;

            // ----- helpers -----
            function updateStatus(msg, type = 'info') {
                statusText.textContent = msg;
                const label = statusLabel;
                if (type === 'scanning') {
                    label.textContent = '🔄 scanning';
                    label.style.color = '#f0c94d';
                } else if (type === 'success') {
                    label.textContent = '✅ done';
                    label.style.color = '#4caf84';
                } else if (type === 'error') {
                    label.textContent = '⚠️ error';
                    label.style.color = '#f28b82';
                } else if (type === 'stopped') {
                    label.textContent = '⏹ stopped';
                    label.style.color = '#f28b82';
                } else {
                    label.textContent = '⏳ ready';
                    label.style.color = '#b9c8e0';
                }
            }

            function updateStats(urls, params, findingsCount, queue) {
                statUrls.textContent = urls || 0;
                statParams.textContent = params || 0;
                statFindings.textContent = findingsCount || 0;
                statQueue.textContent = queue || 0;
            }

            function renderFindings() {
                vulnList.innerHTML = '';
                if (!findings || findings.length === 0) {
                    vulnList.innerHTML = '<li class="empty">✅ no confirmed XSS findings</li>';
                    return;
                }
                findings.forEach((f, idx) => {
                    const li = document.createElement('li');
                    li.className = 'vuln-item';
                    const title = document.createElement('div');
                    title.className = 'title';
                    title.innerHTML = `⚠️ ${f.context || 'unknown'} · ${f.parameter || 'param'}`;
                    const meta = document.createElement('div');
                    meta.className = 'meta';
                    meta.innerHTML = `<span>${f.url || ''}</span> <span>severity: ${f.severity || 'medium'}</span>`;
                    const evidence = document.createElement('div');
                    evidence.className = 'evidence';
                    evidence.textContent = `payload: ${f.payload || ''} → ${f.evidence || 'reflected'}`;
                    li.appendChild(title);
                    li.appendChild(meta);
                    li.appendChild(evidence);
                    vulnList.appendChild(li);
                });
            }

            // ----- API calls -----
            async function startScan(target) {
                try {
                    const resp = await fetch('/api/scan/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target })
                    });
                    if (!resp.ok) throw new Error('scan start failed');
                    const data = await resp.json();
                    return data.scanId;
                } catch (e) {
                    throw new Error('API error: ' + e.message);
                }
            }

            async function getStatus(scanId) {
                try {
                    const resp = await fetch(`/api/scan/status/${scanId}`);
                    if (!resp.ok) throw new Error('status fetch failed');
                    return await resp.json();
                } catch (e) {
                    return null;
                }
            }

            async function stopScan(scanId) {
                try {
                    await fetch(`/api/scan/stop/${scanId}`, { method: 'POST' });
                } catch (e) { /* ignore */ }
            }

            async function getResults(scanId) {
                try {
                    const resp = await fetch(`/api/scan/results/${scanId}`);
                    if (!resp.ok) throw new Error('results fetch failed');
                    return await resp.json();
                } catch (e) {
                    return { findings: [] };
                }
            }

            // ----- main scan loop (polling) -----
            async function runScan(target) {
                if (scanActive) return;
                scanActive = true;
                scanBtn.disabled = true;
                stopBtn.disabled = false;
                findings = [];
                renderFindings();
                updateStats(0,0,0,0);
                updateStatus('starting scan...', 'scanning');
                progressFill.style.width = '0%';

                try {
                    scanId = await startScan(target);
                    if (!scanId) throw new Error('no scan id');

                    let done = false;
                    let lastFindings = [];
                    while (!done && scanActive) {
                        const status = await getStatus(scanId);
                        if (!status) { await new Promise(r => setTimeout(r, 600)); continue; }

                        // update stats
                        updateStats(status.urlsScanned || 0, status.paramsTested || 0, status.findingsCount || 0, status.queueLength || 0);
                        progressFill.style.width = Math.min(100, status.progress || 0) + '%';
                        updateStatus(status.message || 'scanning...', 'scanning');

                        if (status.findings && status.findings.length > 0) {
                            findings = status.findings;
                            renderFindings();
                        }

                        if (status.state === 'completed' || status.state === 'stopped' || status.state === 'error') {
                            done = true;
                            if (status.state === 'completed') {
                                updateStatus('scan completed', 'success');
                            } else if (status.state === 'stopped') {
                                updateStatus('scan stopped by user', 'stopped');
                            } else {
                                updateStatus('scan error: ' + (status.error || 'unknown'), 'error');
                            }
                            // final results
                            const final = await getResults(scanId);
                            if (final.findings) {
                                findings = final.findings;
                                renderFindings();
                                updateStats(final.urlsScanned || 0, final.paramsTested || 0, findings.length, 0);
                            }
                            break;
                        }

                        await new Promise(r => setTimeout(r, 800));
                    }
                } catch (err) {
                    updateStatus('scan error: ' + err.message, 'error');
                } finally {
                    scanActive = false;
                    scanBtn.disabled = false;
                    stopBtn.disabled = true;
                    if (findings.length === 0 && vulnList.querySelector('.empty') === null) {
                        // ensure empty state
                        renderFindings();
                    }
                }
            }

            // ----- event handlers -----
            scanBtn.addEventListener('click', function() {
                const target = targetInput.value.trim();
                if (!target) {
                    updateStatus('please enter a URL', 'error');
                    return;
                }
                if (scanActive) return;
                runScan(target);
            });

            stopBtn.addEventListener('click', function() {
                if (scanId && scanActive) {
                    stopScan(scanId);
                    updateStatus('stopping...', 'stopped');
                    scanActive = false;
                    stopBtn.disabled = true;
                    scanBtn.disabled = false;
                }
            });

            clearBtn.addEventListener('click', function() {
                if (scanActive) return;
                findings = [];
                renderFindings();
                updateStats(0,0,0,0);
                progressFill.style.width = '0%';
                updateStatus('cleared', 'info');
                targetInput.value = '';
            });

            exportBtn.addEventListener('click', function() {
                if (findings.length === 0) {
                    updateStatus('no findings to export', 'error');
                    return;
                }
                const data = JSON.stringify({ findings, exportedAt: new Date().toISOString() }, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `xss-findings-${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                updateStatus('exported', 'success');
            });

            targetInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); scanBtn.click(); }
            });

            // initial state
            updateStatus('ready', 'info');
            renderFindings();
            updateStats(0,0,0,0);
        })();
    </script>
</body>
</html>
